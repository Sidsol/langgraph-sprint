    exit_code: 0
    observed_dedupe_count: 3
    observed_domain: docs.langchain.com
  deep_smoke:
    command: uv run python -c "from langgraph.types import Command; from agent import build_graph, make_initial_state; import uuid; g = build_graph(mode='offline'); tid = 't-smoke-008-' + uuid.uuid4().hex[:6]; cfg = {'configurable': {'thread_id': tid}}; r1 = g.invoke(make_initial_state('Compare LangGraph and LangChain agent abstractions', tid, 'offline'), cfg); rr = r1.get('research_report'); print('depth:', r1.get('research_depth'), 'sub_queries:', len(rr['sub_queries_run']) if rr else 0, 'key_facts:', len(rr['key_facts']) if rr else 0); r2 = g.invoke(Command(resume={'decision': 'approved'}), cfg); print('published:', r2.get('published_path'))"
    exit_code: 0
    observed_depth: deep
    observed_sub_queries: 5
    observed_key_facts: 6
  shallow_legacy_smoke:
    command: uv run python -c "from pathlib import Path; from langgraph.types import Command; from agent import build_graph, make_initial_state; import uuid; g = build_graph(mode='offline'); tid = 't-smoke-008-legacy-' + uuid.uuid4().hex[:6]; cfg = {'configurable': {'thread_id': tid}}; g.invoke(make_initial_state('What is 7*8?', tid, 'offline'), cfg); r2 = g.invoke(Command(resume={'decision': 'approved'}), cfg); published = Path(r2['published_path']).read_text(encoding='utf-8'); assert '7*8 = 56' in published; assert '## Direct Answer' not in published; print('legacy publish ok:', r2['published_path'])"
